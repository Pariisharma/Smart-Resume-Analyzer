<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Smart Resume</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            overflow: hidden;
        }

        /* LEFT PANEL */
        .left-panel {
            flex: 1;
            color: white;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-panel h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .left-panel p {
            font-size: 18px;
            opacity: 0.8;
        }

        /* RIGHT PANEL */
        .right-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* GLASS CARD */
        .glass-card {
            width: 400px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }

        .glass-card h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .register-btn {
            background: #22c55e;
            color: white;
        }

        .bottom-text {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .bottom-text a {
            color: #3b82f6;
            text-decoration: none;
        }

        /* Responsive */
        @media(max-width: 900px) {
            body {
                flex-direction: column;
            }

            .left-panel {
                text-align: center;
                padding: 30px;
            }
        }

    </style>
</head>
<body>

    <!-- LEFT -->
    <div class="left-panel">
        <h1>Create Your Account</h1>
        <p>
            Join Smart Resume Analyzer and unlock
            AI-powered resume insights and job matching.
        </p>
    </div>

    <!-- RIGHT -->
    <div class="right-panel">
        <div class="glass-card">
            <h2>Register 🚀</h2>

            <form method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>

                <button type="submit" class="btn register-btn">
                    Create Account
                </button>
            </form>

            <div class="bottom-text">
                Already have an account?
                <a href="/login">Login</a>
            </div>
        </div>
    </div>

</body>
</html>
