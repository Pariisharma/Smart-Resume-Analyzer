<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Smart Resume Analyzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
        }

        .glass-card {
            width: 500px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            color: white;
            animation: fadeIn 0.8s ease-in-out;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            opacity: 0.8;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.9);
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            transition: 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
        }

        .logout-btn {
            margin-top: 20px;
            background: #ef4444;
        }

        .logout-btn:hover {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== LOADER OVERLAY ===== */
        #loaderOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 9999;
        }

        #loaderOverlay.active {
            visibility: visible;
            opacity: 1;
        }

        .loader-box {
            text-align: center;
            color: white;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top: 6px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Fix file input text color */
        .file-input {
            cursor: pointer;
            font-size: 14px;
        }

        .dark-mode .file-input {
            color: #111 !important;
            background-color: #e5e7eb;
        }

        .upload-hint {
            display: block;
            margin-bottom: 12px;
            font-size: 13px;
            opacity: 0.7;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>

    <div class="glass-card">
        <h1>Hello, {{ username }} 👋</h1>
        <p style="margin-bottom:20px; opacity:0.8;">
            Welcome back to Smart Resume Analyzer 🚀
        </p>

        <form action="/upload" method="POST" enctype="multipart/form-data">
            <label style="margin-bottom:6px;">
                Upload Your Resume
            </label>
            <small class="upload-hint">
                📄 PDF &nbsp; | &nbsp; 📝 DOCX
            </small>
            <input type="file" name="resume" class="form-control file-input" accept=".pdf,.docx" required>
            <button type="submit" id="analyzeBtn">
                <span id="btnText">Analyze Resume</span>
            </button>
        </form>

        <form action="/logout">
            <button class="logout-btn">Logout</button>
        </form>
    </div>


    <!-- PREMIUM LOADING OVERLAY -->
    <div id="loaderOverlay">
        <div class="loader-box">
            <div class="spinner"></div>
            <p>Analyzing Resume...</p>
        </div>
    </div>

    <script>
        const form = document.querySelector("form[action='/upload']");
        const overlay = document.getElementById("loaderOverlay");
        const btn = document.getElementById("analyzeBtn");

        form.addEventListener("submit", function () {
            overlay.classList.add("active");
            btn.disabled = true;
            btn.style.opacity = "0.7";
        });
    </script>
</body>

</html>
