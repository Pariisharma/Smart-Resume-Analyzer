<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Smart Resume Analyzer</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #4CAF50;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-light">

    <div class="container vh-100 d-flex justify-content-center align-items-center">

        <div class="card shadow-lg p-5" style="width: 500px; border-radius: 15px;">

            <h2 class="text-center mb-4 text-primary">
                Smart Resume Analyzer
            </h2>

            <!-- FORM STARTS HERE -->
            <form action="/upload" method="POST" enctype="multipart/form-data" onsubmit="showLoader()">

                <div class="mb-3">
                    <label class="form-label">Upload Your Resume (PDF)</label>
                    <input type="file" class="form-control" name="resume" accept=".pdf" required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">
                        Analyze Resume
                    </button>
                </div>

            </form>
            <!-- FORM ENDS HERE -->

        </div>

    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" style="
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 9999;
    text-align: center;
    color: white;
    font-size: 22px;
    font-family: Arial;
">
        <div style="
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    ">
            <div class="spinner"></div>
            <p>Analyzing Resume... Please wait</p>
        </div>
    </div>

    <script>
        function showLoader() {
            document.getElementById("loadingOverlay").style.display = "block";
        }
    </script>

</body>

</html>
